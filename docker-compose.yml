services:
  postgres:
    image: postgres:16-alpine
    container_name: shipment-platform-postgres
    environment:
      POSTGRES_DB: shipment_platform
      POSTGRES_USER: shipment
      POSTGRES_PASSWORD: shipment
    ports:
      - "5434:5432"
    volumes:
      - shipment_platform_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U shipment -d shipment_platform"]
      interval: 3s
      timeout: 5s
      retries: 10

  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: shipment-platform-rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: shipment
      RABBITMQ_DEFAULT_PASS: shipment

  api:
    profiles: ["full"]
    build:
      context: .
      dockerfile: src/ShipmentPlatform.Api/Dockerfile
    container_name: shipment-platform-api
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__DefaultConnection: Host=postgres;Port=5432;Database=shipment_platform;Username=shipment;Password=shipment
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_started

volumes:
  shipment_platform_pgdata:
