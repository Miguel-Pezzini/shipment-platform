global:
  scrape_interval: 5s

scrape_configs:
  - job_name: shipment-platform-api
    metrics_path: /metrics
    static_configs:
      - targets:
          - api:8080
          - host.docker.internal:5208

  - job_name: shipment-platform-outbox
    metrics_path: /metrics
    static_configs:
      - targets:
          - outbox:9464
          - host.docker.internal:9464

  - job_name: shipment-platform-consumers
    metrics_path: /metrics
    static_configs:
      - targets:
          - consumers:9465
          - host.docker.internal:9465
